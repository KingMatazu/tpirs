name: staging

on:
  push:
    branches: [main]

# On merge: build and push the image to GHCR, run the compose smoke test against
# the pushed image, then run the deploy step through the selected target
# (default `noop`). See docs/adr/0004-delivery-and-deploy.md.
jobs:
  staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      DEPLOY_TARGET: noop
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image ref
        id: image
        run: |
          echo "ref=${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/app.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Staging smoke test
        run: sh scripts/ci/staging-smoke.sh "${{ steps.image.outputs.ref }}"
      - name: Deploy
        run: sh scripts/ci/deploy.sh "sha-${GITHUB_SHA}"
