name: nightly

# Deep property-test run. The per-commit CI runs the same properties with
# FAST_CHECK_RUNS=100 to keep the feedback loop fast; this job explores a much
# larger input space once a day, so a rare counterexample is found before it
# reaches a release. See docs/adr/0014-fast-check-property-tests.md.
on:
  schedule:
    # 03:17 UTC. Deliberately off the hour: every scheduled workflow on
    # GitHub fires at the top of the hour, and the queue there is long.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Property tests (deep run)
        env:
          FAST_CHECK_RUNS: 2000
        run: pnpm --filter @tpirs/domain test

  # Full-rate load, once a day. The PR gate runs a quarter rate for a minute;
  # this explores the budgets in docs/performance-budgets.md at the offered load
  # they were written for, and keeps the JSON report as the trend record.
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Load — verify at target rate
        run: |
          sh scripts/load/run.sh verify 200 300
      - name: Load — webhook intake at target rate
        run: |
          sh scripts/load/run.sh webhooks 50 300
      - name: Upload load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-reports
          path: load-reports/
          if-no-files-found: ignore
