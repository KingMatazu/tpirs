# Template tenant configuration. Copy to tenants/<state-slug>/tenant.config.yaml.
# Schema and validation live in packages/config (@tpirs/config). Every value that
# varies between deployments belongs here; core code must not hardcode any of it.
identity:
  name: "Template State"
  slug: "template-state"
  legalEntity: "Template State Revenue Authority"
  supportContacts:
    email: "support@example.state.gov"
    phone: "+000000000000"

locale:
  defaultLanguage: "en"
  enabledLanguages: ["en"]
  timezone: "Africa/Lagos"
  currency: "NGN"
  numberFormat: "en-NG"
  dateFormat: "dd/MM/yyyy"

branding:
  appName: "Template Levy"
  logoUrl: "https://cdn.example.state.gov/logo.svg"
  colors:
    primary: "#0a5a4a"
    secondary: "#053b33"
    accent: "#f2c200"
  smsSenderId: "TMPLLEVY"
  receiptHeader: "Template State Levy"
  receiptFooter: "Thank you for supporting Template State"

assetTypes:
  - key: "bike"
    label: "Motorbike"
    attributes:
      - key: "plate_number"
        label: "Plate number"
        type: "string"
        required: true
        pattern: "^[A-Z0-9]{5,8}$"
    qrFormat: "TMP-{id}"
    shortCodeFormat: "B{id}"
    stickerSpec: "60x60mm vinyl, weatherproof"
  - key: "tuktuk"
    label: "Tuk-tuk"
    attributes:
      - key: "plate_number"
        label: "Plate number"
        type: "string"
        required: true
        pattern: "^[A-Z0-9]{5,8}$"
    qrFormat: "TMP-K{id}"
    shortCodeFormat: "K{id}"
    stickerSpec: "60x60mm vinyl, weatherproof"

obligations:
  model: "pay_per_use"
  frequency: "daily"
  prepaidAllowed: false
  arrearsPolicy: "none"
  graceDays: 0
  feeRules:
    - key: "bike-daily"
      assetTypeKey: "bike"
      amountMinor: 20000
      effectiveFrom: "2026-01-01"
    - key: "tuktuk-daily"
      assetTypeKey: "tuktuk"
      amountMinor: 30000
      effectiveFrom: "2026-01-01"

providers:
  - port: "PaymentProvider"
    adapter: "mock"
  - port: "SmsProvider"
    adapter: "mock"
  - port: "UssdProvider"
    adapter: "mock"

channels:
  ussdCode: "*000*0#"
  smsKeyword: "LEVY"
  otpMessageTemplate: "Template Levy: your verification code is {code}."
  smsReceiptTemplate: "Template Levy receipt {receiptNo}: {amount} paid for {assetRef} on {date}."
  # Collector cash receipt (D38). Kept separate from the gateway receipt on
  # purpose: cash is not a gateway payment. Placeholders: {amount}, {assetRef},
  # {date}, {receiptNo}. Omit it to use the built-in default copy.
  cashReceiptTemplate: "Template Levy cash {amount} for {assetRef}. Receipt {receiptNo}, {date}."
  startMenu: "main"
  messages:
    en:
      ussd.main.prompt: "Template Levy. Reply with an option."
      ussd.main.pay: "Pay today's levy"
      ussd.main.status: "Check payment status"
      ussd.main.invalid: "Unknown option. Try again."
      ussd.common.cancel: "Cancel"
      ussd.common.confirm: "Confirm"
      ussd.pay.enter: "Enter your vehicle plate or sticker code."
      ussd.pay.invalid: "That code is not valid. Try again."
      ussd.pay.confirm: "Pay today's levy for {assetRef}?"
      ussd.status.enter: "Enter your vehicle plate or sticker code."
      ussd.status.invalid: "That code is not valid. Try again."
      ussd.status.paid: "Paid today for {assetRef}."
      ussd.status.none: "No payment recorded today for {assetRef}."
      ussd.pay.created: "Payment request created for {assetRef}."
      ussd.pay.failed: "We could not start a payment. Try again later."
      ussd.pay.balance: "Paid today from your balance for {assetRef}."
      ussd.pay.covered: "Your balance already covers today's levy for {assetRef}."
      ussd.pay.insufficient: "Your balance is short by {amount} for {assetRef}."
      ussd.asset.unknown: "No vehicle matches {assetRef}."
      ussd.common.error: "Something went wrong. Try again later."
      ussd.session.cancelled: "Cancelled. Dial back whenever you need to pay."
      ussd.session.too_many_steps: "Too many steps. Please start again."
      ussd.rate.limited: "Too many requests. Please wait a minute and try again."
      ussd.session.busy: "Your request is still being processed. Please wait."
      sms.command.unknown: "Reply with {keyword} followed by your plate or sticker code."
  ussd:
    sessionTimeoutSeconds: 180
    maxInputLength: 32
    maxSteps: 12
    rateLimit:
      perMsisdnPerMinute: 20
      perIpPerMinute: 120
  sms:
    maxSendsPerDay: 5000
    maxSendsPerRecipientPerDay: 10
    rateLimit:
      perMsisdnPerMinute: 6
  menus:
    - key: "main"
      type: "menu"
      promptKey: "ussd.main.prompt"
      invalidKey: "ussd.main.invalid"
      options:
        - key: "1"
          labelKey: "ussd.main.pay"
          next: "pay.enter"
        - key: "2"
          labelKey: "ussd.main.status"
          next: "status.enter"
        - key: "0"
          labelKey: "ussd.common.cancel"
          action: "cancel"
    - key: "pay.enter"
      type: "input"
      promptKey: "ussd.pay.enter"
      input:
        key: "assetRef"
        pattern: "^[A-Z0-9]{5,8}$"
        errorKey: "ussd.pay.invalid"
      next: "pay.confirm"
    - key: "pay.confirm"
      type: "menu"
      promptKey: "ussd.pay.confirm"
      options:
        - key: "1"
          labelKey: "ussd.common.confirm"
          action: "pay"
        - key: "2"
          labelKey: "ussd.common.cancel"
          action: "cancel"
    - key: "status.enter"
      type: "input"
      promptKey: "ussd.status.enter"
      input:
        key: "assetRef"
        pattern: "^[A-Z0-9]{5,8}$"
        errorKey: "ussd.status.invalid"
      next: "status.run"
    - key: "status.run"
      type: "action"
      action: "status"

cashRules:
  enabled: true
  floatCeilingMinor: 5000000
  depositDeadlineHours: 24
  freezeOnShortfall: true

# Omit this section for the default (`wallet`). `suspense` sends every short
# payment to finance for review instead of crediting the asset wallet.
payments:
  underpaymentPolicy: "wallet"

featureFlags:
  disputes: true
  prepay: false
  offlineMode: true
  anomalyAlerts: true

field:
  # Hours of dead-zone work before the cached paid set is announced as stale.
  offlineGraceHours: 8
  # Maximum queued offline scans and disputes held on one device.
  maxQueueItems: 1000
  # Reasons offered on the officer's dispute form. `other` is required as a
  # fallback so an officer never has to pick a wrong reason.
  disputeReasons:
    - code: "wrong_location"
      label: "Wrong location"
    - code: "already_paid"
      label: "Already paid"
    - code: "technical_issue"
      label: "Technical issue"
    - code: "other"
      label: "Other"

# Nightly reconciliation and anomaly evaluation (Phase 8).
#
# enabled: whether the worker runs the nightly reconciliation. Default: true.
# schedule: cron in the tenant timezone. Validated structurally at load; the
#   worker resolves the next occurrence with cron-parser (D48). Default: 02:00.
# toleranceMinor: whole-day slack for ledger, clearing and float differences,
#   in minor units. Default: 0 (exact).
# feeToleranceMinor: how much of a payment the gateway may keep before the
#   difference becomes an exception instead of a fee leg (D45). Default: 0.
# suspenseAgeingDays: suspense older than this many days raises a warning.
#   Default: 7.
# notifyRole: role that sees reconciliation and anomaly alerts. Default: none
#   (the key is required).
# anomalyRules: every rule ships disabled until pilot baselines exist (D46).
#   Percent rules need thresholdPercent; suspense_growth needs thresholdMinor;
#   collector_deposit_lag reads thresholdMinor as a multiple of the deposit
#   deadline (default 1). "asset" is not a rule subject by design.
# settlementImport: where the bank/gateway statement comes from and how its
#   columns map (D21). Omit until a statement export exists; reconciliation
#   still runs, it just cannot settle gateway fees from a file.
reconciliation:
  enabled: true
  schedule: "0 2 * * *"
  toleranceMinor: 100
  feeToleranceMinor: 1000
  suspenseAgeingDays: 7
  notifyRole: "finance_admin"
  anomalyRules:
    - key: "collector_volume_drop"
      enabled: false
      windowDays: 14
      thresholdPercent: 30
      severity: "warning"
    - key: "collector_deposit_lag"
      enabled: false
      windowDays: 7
      thresholdMinor: 1
      severity: "warning"
    - key: "zone_compliance_drop"
      enabled: false
      windowDays: 14
      thresholdPercent: 20
      severity: "warning"
    - key: "officer_scan_volume_change"
      enabled: false
      windowDays: 14
      thresholdPercent: 50
      severity: "info"
    - key: "suspense_growth"
      enabled: false
      windowDays: 7
      thresholdMinor: 500000
      severity: "warning"
  settlementImport:
    provider: "mock"
    defaultCurrency: "NGN"
    columns:
      reference: "reference"
      amount: "amount"
      fee: "fee"
      currency: "currency"
      settledAt: "settled_at"
      description: "narration"
    dateFormat: "YYYY-MM-DD HH:mm:ss"
    amountInMinorUnits: true
    decimalSeparator: "."

compliance:
  retentionDays: 2555
  dataResidency: "templatestate"
  consentTextKey: "consent.default"
