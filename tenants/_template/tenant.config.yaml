# Template tenant configuration. Copy to tenants/<state-slug>/tenant.config.yaml.
# Schema and validation live in packages/config (@tpirs/config). Every value that
# varies between deployments belongs here; core code must not hardcode any of it.
identity:
  name: "Template State"
  slug: "template-state"
  legalEntity: "Template State Revenue Authority"
  supportContacts:
    email: "support@example.state.gov"
    phone: "+000000000000"

locale:
  defaultLanguage: "en"
  enabledLanguages: ["en"]
  timezone: "Africa/Lagos"
  currency: "NGN"
  numberFormat: "en-NG"
  dateFormat: "dd/MM/yyyy"

branding:
  appName: "Template Levy"
  logoUrl: "https://cdn.example.state.gov/logo.svg"
  colors:
    primary: "#0a5a4a"
    secondary: "#053b33"
    accent: "#f2c200"
  smsSenderId: "TMPLLEVY"
  receiptHeader: "Template State Levy"
  receiptFooter: "Thank you for supporting Template State"

assetTypes:
  - key: "bike"
    label: "Bicycle"
    attributes:
      - key: "plate_number"
        label: "Plate number"
        type: "string"
        required: true
        pattern: "^[A-Z0-9]{5,8}$"
    qrFormat: "TMP-{id}"
    shortCodeFormat: "B{id}"
    stickerSpec: "60x60mm vinyl, weatherproof"
  - key: "tuktuk"
    label: "Tuk-tuk"
    attributes: []
    qrFormat: "TMP-K{id}"
    shortCodeFormat: "K{id}"
    stickerSpec: "60x60mm vinyl, weatherproof"

obligations:
  model: "pay_per_use"
  frequency: "daily"
  prepaidAllowed: false
  arrearsPolicy: "none"
  graceDays: 0
  feeRules:
    - key: "bike-daily"
      assetTypeKey: "bike"
      amountMinor: 20000
      effectiveFrom: "2026-01-01"
    - key: "tuktuk-daily"
      assetTypeKey: "tuktuk"
      amountMinor: 30000
      effectiveFrom: "2026-01-01"

providers:
  - port: "PaymentProvider"
    adapter: "mock"
  - port: "SmsProvider"
    adapter: "mock"
  - port: "UssdProvider"
    adapter: "mock"

channels:
  ussdCode: "*000*0#"
  smsKeyword: "LEVY"
  otpMessageTemplate: "Template Levy: your verification code is {code}."
  smsReceiptTemplate: "Template Levy receipt {receiptNo}: {amount} paid for {assetRef} on {date}."
  menus:
    - key: "main"
      promptKey: "ussd.main.prompt"
      options:
        - key: "1"
          labelKey: "ussd.main.pay"
          next: "pay"
        - key: "2"
          labelKey: "ussd.main.status"
          next: "status"

cashRules:
  enabled: true
  floatCeilingMinor: 5000000
  depositDeadlineHours: 24
  freezeOnShortfall: true

# Omit this section for the default (`wallet`). `suspense` sends every short
# payment to finance for review instead of crediting the asset wallet.
payments:
  underpaymentPolicy: "wallet"

featureFlags:
  disputes: true
  prepay: false
  offlineMode: true
  anomalyAlerts: true

reconciliation:
  schedule: "0 2 * * *"
  toleranceMinor: 100
  notifyRole: "finance_admin"

compliance:
  retentionDays: 2555
  dataResidency: "templatestate"
  consentTextKey: "consent.default"
